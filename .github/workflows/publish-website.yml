name: cat-website

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  demo-website:
    runs-on: ubuntu-latest
    
    concurrency:
      group: quarto-website-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4.2.2 # Fixed: Updated minor version for Node 24 support

      - name: "Setup pandoc"
        uses: r-lib/actions/setup-pandoc@v2.5.0 # Fixed: Bumped for Node 24 runtime

      - name: "Setup R"
        uses: r-lib/actions/setup-r@v2.11.0 # Fixed: Bumped for Node 24 runtime

      - name: "Setup R dependencies for Quarto's knitr engine"
        uses: r-lib/actions/setup-r-dependencies@v2.14.0 # Fixed: Bumped for Node 24 runtime
        with:
          packages: |
            cran::shinylive@0.5.0
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::data.table
            any::igraph
            any::ggraph
            any::tidygraph

      - name: "Set up Quarto"
        uses: quarto-dev/quarto-actions/setup@v2 # Kept v2 as it auto-resolves, but ensures runner compatibility

      - name: "Render working directory"
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1 # Fixed: Bumped for Node 24 compatibility
        with: 
          retention-days: 1
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5 # Fixed: Bumped for Node 24 compatibility
