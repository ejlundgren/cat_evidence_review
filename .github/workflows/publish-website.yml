name: cat-website

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  demo-website:
    runs-on: ubuntu-latest
    
    # Opt into the newer Node 24 environment execution completely
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    concurrency:
      group: quarto-website-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4.2.2 # Explicitly uses the Node 24 patched release

      - name: "Setup pandoc"
        uses: r-lib/actions/setup-pandoc@v2

      - name: "Setup R"
        uses: r-lib/actions/setup-r@v2

      - name: "Setup R dependencies for Quarto's knitr engine"
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::shinylive@0.5.0
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::data.table
            any::igraph
            any::ggraph
            any::tidygraph

      - name: "Set up Quarto"
        uses: quarto-dev/quarto-actions/setup@v2

      - name: "Render working directory"
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: 
          retention-days: 1
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
