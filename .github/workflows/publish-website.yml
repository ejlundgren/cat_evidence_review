name: Render and Publish Shinylive Site
on:
  push:
    branches:
      - main  # Change to master if your default branch is named master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Crucial for GitHub Actions deployment
      id-token: write   # Crucial for GitHub Actions deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: "Setup R dependencies for Quarto's knitr engine"
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::shinylive@0.5.0
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::data.table
            any::igraph
            any::ggraph
            any::tidygraph
            any::metafor
            any::ggplot2
            any::glmmTMB
            any::ggstance
            any::dplyr
            any::tidyr
            any::readxl
            any::stringr
            any::patchwork
            any::broom
            any::broom.mixed
            any::sf
            any::rotl
            any::ape
            any::leafpop
            any::plotly
            any::mapview
            any::here

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Ensures the quarto shinylive extension is available inside the runner
      - name: Install Quarto Shinylive Extension
        run: |
          quarto add --no-prompt quarto-ext/shinylive

      # This creates the missing _site/ folder by rendering your code
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4